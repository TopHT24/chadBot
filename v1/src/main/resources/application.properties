spring.application.name=v1

# Jackson 3 rejects JSON that omits a primitive field (int, boolean) by default.
# Let them default to 0/false so @Valid constraints (e.g. @Min(1)) report clear errors.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Largest study file a student can upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
